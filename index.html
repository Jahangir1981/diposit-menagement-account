<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deposit Management — Firebase</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,'Noto Sans Bengali',sans-serif;background:#f3f6fb;color:#172033}header{background:#fff;padding:16px;border-bottom:1px solid #ddd}main{max-width:1100px;margin:auto;padding:14px}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.card{background:#fff;border:1px solid #dce2eb;border-radius:12px;padding:16px;margin-bottom:12px}h1{font-size:24px;margin:0}h2{font-size:19px;margin:0 0 14px}button{border:0;border-radius:8px;background:#185adb;color:#fff;padding:10px 13px;font-weight:bold;cursor:pointer}button.alt{background:#e7edf8;color:#172033}button.red{background:#b42318}button.green{background:#087443}.nav{display:flex;gap:7px;flex-wrap:wrap;margin:12px 0}.nav button{background:#e7edf8;color:#172033}.nav button.on{background:#185adb;color:#fff}.field{margin:10px 0;display:flex;flex-direction:column;gap:5px}.field input,.field textarea,.field select,input[type=date],input[type=search]{border:1px solid #cbd5e1;border-radius:8px;padding:10px;width:100%;font:inherit}.field textarea{min-height:65px}.muted{color:#64748b;font-size:13px}.stat{font-size:25px;font-weight:bold;margin-top:8px}.notice{padding:12px;background:#dff8e8;border-radius:8px;margin:10px 0}.error{background:#fee2e2}table{border-collapse:collapse;width:100%;min-width:650px}th,td{border-bottom:1px solid #e2e8f0;text-align:left;padding:9px;font-size:14px}th{background:#f8fafc}.tablewrap{overflow:auto}.pill{padding:4px 7px;border-radius:20px;font-size:12px;font-weight:bold}.pending{background:#fff0c2}.approved{background:#d9fbe8}.rejected{background:#fee2e2}.logo{width:58px;height:58px;object-fit:contain;border:1px solid #ddd;border-radius:9px}.login{max-width:440px;margin:7vh auto}.login .card{padding:24px}.between{justify-content:space-between}.danger{background:#fff7ed;border:1px solid #fed7aa;padding:12px;border-radius:8px;font-size:14px}@media(max-width:600px){main{padding:9px}h1{font-size:20px}.card{padding:12px}}@media print{header,.nav,.noprint{display:none!important}body{background:white}}
</style></head><body><div id="app"><main><div class="card">Firebase অ্যাপ লোড হচ্ছে…</div></main></div>
<script>
// Visible diagnostic if Firebase's JavaScript modules fail to load.
window.__depositAppBooted = false;
window.addEventListener('error', function (e) {
  console.error('App startup error:', e.message || e);
});
window.setTimeout(function () {
  if (!window.__depositAppBooted) {
    var app = document.getElementById('app');
    if (app) app.innerHTML = '<main><div class="card"><h2>অ্যাপ চালু হয়নি</h2><p>Firebase-এর JavaScript ফাইল লোড হয়নি। ইন্টারনেট চালু আছে কি না দেখুন, Chrome-এ পেজটি আবার Reload করুন। VPN/Ad blocker থাকলে বন্ধ করে চেষ্টা করুন।</p><p class="muted">সমস্যা থাকলে এই HTML ফাইলটি GitHub Pages-এ আবার আপলোড করতে হবে।</p></div></main>';
  }
}, 15000);
</script>
<script type="module">
import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signOut, createUserWithEmailAndPassword, updatePassword, EmailAuthProvider, reauthenticateWithCredential } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import { getFirestore, collection, doc, getDoc, getDocs, query, where, orderBy, addDoc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const firebaseConfig = {
  apiKey: "AIzaSyCPf4HrdYKvFfZz3N8c6jaVpfQl-na4G_A",
  authDomain: "deposit-management-account.firebaseapp.com",
  projectId: "deposit-management-account",
  storageBucket: "deposit-management-account.firebasestorage.app",
  messagingSenderId: "1088003900022",
  appId: "1:1088003900022:web:918b71a406ddc390f89557",
  measurementId: "G-39G8VD546D"
};
const app=initializeApp(firebaseConfig), auth=getAuth(app), db=getFirestore(app);
const secondaryApp=initializeApp(firebaseConfig,'MemberProvisioning'), secondaryAuth=getAuth(secondaryApp), secondaryDb=getFirestore(secondaryApp);
window.__depositAppBooted = true;
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])), today=()=>new Date().toISOString().slice(0,10), money=n=>'৳ '+Number(n||0).toLocaleString('en-BD',{maximumFractionDigits:2}), usernameEmail=u=>`${String(u).trim().toLowerCase()}@deposit-management-account.firebaseapp.com`;
let profile=null, currentUser=null, tab='dashboard', notice='', error=false, members=[], payments=[], settings={name:'আমাদের সংস্থা',address:'সংস্থার ঠিকানা'}, unsubUsers=null,unsubPayments=null, search='';
function flash(s,e=false){notice=s;error=e;render()}
function sayErr(e){console.error(e);const code=e?.code||'';let m=e?.message||'অজানা সমস্যা';if(code.includes('permission-denied'))m='অনুমতি নেই। Firestore Rules ও Admin profile ঠিক আছে কি না যাচাই করুন।';else if(code.includes('email-already-in-use'))m='এই Username আগে ব্যবহার করা হয়েছে।';else if(code.includes('weak-password'))m='পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের দিন।';else if(code.includes('invalid-credential')||code.includes('user-not-found')||code.includes('wrong-password'))m='Username/Email অথবা Password সঠিক নয়।';flash(m,true)}
function loginView(){return `<main class="login"><div class="card"><h2>Deposit Management Login</h2><div class="danger">Admin হলে Firebase Authentication-এ তৈরি করা ইমেইল দিয়ে লগইন করুন। Member হলে Admin দেওয়া Username ও Password দিন।</div><form id="loginForm"><div class="field"><label>Username অথবা Admin Email</label><input id="loginName" required autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPass" type="password" required autocomplete="current-password"></div><button type="submit" id="loginButton">Login</button></form><p class="muted">প্রথমবার Admin লগইনের আগে Firestore-এর users collection-এ আপনার UID-কে role: admin হিসেবে সেট করতে হবে। নিচের নির্দেশিকা দেখুন।</p><button class="alt" id="setupHelp">Admin সেটআপ নির্দেশনা</button><div id="help" class="hidden"><hr><p>১) Firebase Console → Authentication → Users থেকে আপনার Admin ইমেইলের UID কপি করুন।<br>২) Firestore Database → Data → Start collection: <b>users</b><br>৩) Document ID হিসেবে ওই UID দিন। Fields: <b>name</b> (string), <b>username</b> (string, যেমন admin), <b>role</b> (string: admin), <b>phone</b> (string, ফাঁকা চলবে)।<br>৪) Rules ফাইলের নিয়ম Publish করার পরও Console থেকে ডকুমেন্ট তৈরি করা যায়।</p></div></div></main>`}
function header(){return `<header><div class="row between"><div><h1>${esc(settings.name)}</h1><div class="muted">${esc(settings.address)}</div></div>${currentUser?`<div class="row"><b>${profile?.role==='admin'?'Admin':'Member'}</b><button class="alt" id="logout">Logout</button></div>`:''}</div></header>`}
function nav(){let a=profile?.role==='admin'?[['dashboard','Dashboard'],['members','সদস্য'],['payments','জমা Approval'],['reports','Reports'],['org','সংস্থার তথ্য'],['password','Password']]:[['dashboard','Dashboard'],['deposit','জমা Submit'],['password','Password']];return `<div class="nav">${a.map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'on':''}">${v}</button>`).join('')}</div>`}
function paymentTable(list,admin=false){if(!list.length)return '<p class="muted">কোনো জমার তথ্য নেই।</p>';return `<div class="tablewrap"><table><thead><tr><th>তারিখ</th>${admin?'<th>সদস্য</th>':''}<th>পরিমাণ</th><th>ফোন</th><th>Reference</th><th>Status</th><th>কাজ</th></tr></thead><tbody>${list.slice().sort((a,b)=>(b.createdAt||'').localeCompare(a.createdAt||'')).map(p=>{const m=members.find(x=>x.uid===p.uid);return `<tr><td>${esc(p.date||'')}</td>${admin?`<td>${esc(m?.name||p.username||'সদস্য')}</td>`:''}<td><b>${money(p.amount)}</b></td><td>${esc(p.phone||'—')}</td><td>${esc(p.reference||'—')}</td><td><span class="pill ${esc(p.status)}">${esc(p.status)}</span></td><td><div class="row">${admin&&p.status==='pending'?`<button class="green" data-act="approve" data-id="${p.id}">Approve</button><button class="red" data-act="reject" data-id="${p.id}">Reject</button>`:''}${admin?`<button class="red" data-act="deletePayment" data-id="${p.id}">বাতিল</button>`:''}<button class="alt" data-act="receipt" data-id="${p.id}">রসিদ</button></div></td></tr>`}).join('')}</tbody></table></div>`}
function dashboard(){const mine=profile.role==='admin'?payments:payments.filter(p=>p.uid===currentUser.uid);const total=payments.filter(p=>p.status==='approved').reduce((s,p)=>s+Number(p.amount||0),0);return `<div class="grid"><div class="card"><div class="muted">সদস্য</div><div class="stat">${profile.role==='admin'?members.length:1}</div></div><div class="card"><div class="muted">Approved মোট জমা</div><div class="stat">${money(profile.role==='admin'?total:mine.filter(p=>p.status==='approved').reduce((s,p)=>s+Number(p.amount||0),0))}</div></div><div class="card"><div class="muted">Pending জমা</div><div class="stat">${mine.filter(p=>p.status==='pending').length}</div></div><div class="card"><h2>সাম্প্রতিক জমা</h2>${paymentTable(mine.slice(-8),profile.role==='admin')}</div></div>`}
function memberPage(){return `<div class="grid"><div class="card"><h2>নতুন সদস্য যোগ</h2><form id="memberForm"><div class="field"><label>নাম *</label><input id="mname" required></div><div class="field"><label>Username (a-z, 0-9, . _ -) *</label><input id="musername" required pattern="[A-Za-z0-9._-]{3,30}"></div><div class="field"><label>অস্থায়ী Password (কমপক্ষে ৬ অক্ষর) *</label><input id="mpassword" type="password" minlength="6" required></div><div class="field"><label>ফোন (ঐচ্ছিক)</label><input id="mphone"></div><button>সদস্য তৈরি করুন</button></form><p class="muted">সদস্যের লগইন: Username + দেওয়া Password। নিরাপত্তার জন্য সদস্যকে পরে পাসওয়ার্ড পরিবর্তন করতে বলুন।</p></div><div class="card"><h2>সদস্য তালিকা</h2><div class="field"><input id="memberSearch" type="search" placeholder="নাম বা Username দিয়ে খুঁজুন" value="${esc(search)}"></div><div class="tablewrap"><table><tr><th>নাম</th><th>Username</th><th>ফোন</th><th>মোট Approved</th><th>কাজ</th></tr>${members.filter(m=>!search||`${m.name} ${m.username}`.toLowerCase().includes(search.toLowerCase())).map(m=>`<tr><td>${esc(m.name)}</td><td>${esc(m.username)}</td><td>${esc(m.phone||'—')}</td><td>${money(payments.filter(p=>p.uid===m.uid&&p.status==='approved').reduce((s,p)=>s+Number(p.amount||0),0))}</td><td><button class="alt" data-act="editMember" data-id="${m.uid}">নাম/ফোন Edit</button><button class="red" data-act="deleteMember" data-id="${m.uid}">Deactivate</button></td></tr>`).join('')}</table></div></div></div>`}
function depositPage(){const mine=payments.filter(p=>p.uid===currentUser.uid);return `<div class="grid"><div class="card"><h2>জমা Submit</h2><form id="depositForm"><div class="field"><label>টাকার পরিমাণ *</label><input id="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>তারিখ *</label><input id="pdate" type="date" value="${today()}" required></div><div class="field"><label>ফোন (ঐচ্ছিক)</label><input id="phone"></div><div class="field"><label>Reference / Transaction (ঐচ্ছিক)</label><input id="reference"></div><div class="field"><label>নোট (ঐচ্ছিক)</label><textarea id="note"></textarea></div><button>জমা Submit</button></form></div><div class="card"><h2>আমার জমার ইতিহাস</h2>${paymentTable(mine,false)}</div></div>`}
function reports(){let list=payments.filter(p=>!search||`${p.username} ${p.reference} ${p.status} ${p.date}`.toLowerCase().includes(search.toLowerCase()));return `<div class="card"><h2>জমার রিপোর্ট</h2><div class="field"><input id="reportSearch" type="search" value="${esc(search)}" placeholder="Username, Reference, Status বা তারিখ"></div><p>Approved মোট: <b>${money(list.filter(p=>p.status==='approved').reduce((s,p)=>s+Number(p.amount||0),0))}</b></p>${paymentTable(list,true)}<button id="csv" class="alt">CSV Export</button></div>`}
function orgPage(){return `<div class="card"><h2>সংস্থার তথ্য</h2><form id="orgForm"><div class="field"><label>সংস্থার নাম *</label><input id="orgname" required value="${esc(settings.name)}"></div><div class="field"><label>ঠিকানা</label><textarea id="orgaddress">${esc(settings.address)}</textarea></div><button>Save</button></form></div>`}
function passwordPage(){return `<div class="card" style="max-width:500px"><h2>Password পরিবর্তন</h2><form id="pwForm"><div class="field"><label>বর্তমান Password *</label><input id="oldpw" type="password" required></div><div class="field"><label>নতুন Password (কমপক্ষে ৬ অক্ষর) *</label><input id="newpw" type="password" minlength="6" required></div><div class="field"><label>আবার লিখুন *</label><input id="newpw2" type="password" minlength="6" required></div><button>Save Password</button></form><p class="muted">Firebase Authentication-এ Password বদলানো হবে।</p></div>`}
function content(){if(tab==='dashboard')return dashboard();if(tab==='members'&&profile.role==='admin')return memberPage();if(tab==='payments'&&profile.role==='admin')return `<div class="card"><h2>জমা Approval</h2>${paymentTable(payments,true)}</div>`;if(tab==='deposit'&&profile.role==='member')return depositPage();if(tab==='reports'&&profile.role==='admin')return reports();if(tab==='org'&&profile.role==='admin')return orgPage();if(tab==='password')return passwordPage();return '<div class="card">এই বিভাগটি আপনার অনুমতিতে নেই।</div>'}
function render(){const root=$('app');if(!currentUser){root.innerHTML=header()+`<main>${notice?`<div class="notice ${error?'error':''}">${esc(notice)}</div>`:''}${loginView()}</main>`;$('loginForm')?.addEventListener('submit',login);$('setupHelp')?.addEventListener('click',()=>$('help').classList.toggle('hidden'));return}root.innerHTML=header()+`<main>${notice?`<div class="notice ${error?'error':''}">${esc(notice)}</div>`:''}${nav()}${content()}</main>`;wire()}
async function login(e){e.preventDefault();const btn=$('loginButton');if(btn){btn.disabled=true;btn.textContent='লগইন হচ্ছে…'}try{const raw=$('loginName').value.trim();const email=raw.includes('@')?raw:usernameEmail(raw);await signInWithEmailAndPassword(auth,email,$('loginPass').value)}catch(e){sayErr(e)}finally{const b=$('loginButton');if(b){b.disabled=false;b.textContent='Login'}}}
async function refreshData(){if(!currentUser||!profile)return;try{if(unsubUsers)unsubUsers();if(unsubPayments)unsubPayments();if(profile.role==='admin'){unsubUsers=onSnapshot(collection(db,'users'),s=>{members=s.docs.map(d=>({uid:d.id,...d.data()})).filter(m=>m.role==='member');render()},sayErr);unsubPayments=onSnapshot(collection(db,'payments'),s=>{payments=s.docs.map(d=>({id:d.id,...d.data()}));render()},sayErr)}else{members=[{uid:currentUser.uid,...profile}];unsubUsers=null;const q=query(collection(db,'payments'),where('uid','==',currentUser.uid));unsubPayments=onSnapshot(q,s=>{payments=s.docs.map(d=>({id:d.id,...d.data()}));render()},sayErr);const st=await getDoc(doc(db,'settings','org'));if(st.exists())settings={...settings,...st.data()};render()}}catch(e){sayErr(e)}}
onAuthStateChanged(auth,async u=>{currentUser=u;profile=null;members=[];payments=[];if(unsubUsers){unsubUsers();unsubUsers=null}if(unsubPayments){unsubPayments();unsubPayments=null}if(!u){render();return}try{const snap=await getDoc(doc(db,'users',u.uid));if(!snap.exists()){await signOut(auth);flash('এই Auth অ্যাকাউন্টের জন্য users/{UID} প্রোফাইল নেই। Admin হলে নির্দেশনা অনুযায়ী role: admin তৈরি করুন; সদস্য হলে Admin দিয়ে পুনরায় তৈরি করুন।',true);return}profile=snap.data();if(!['admin','member'].includes(profile.role)){await signOut(auth);flash('ব্যবহারকারীর role সঠিক নয়।',true);return}const st=await getDoc(doc(db,'settings','org'));if(st.exists())settings={...settings,...st.data()};tab='dashboard';notice='';await refreshData();render()}catch(e){sayErr(e)}});
function wire(){ $('logout')?.addEventListener('click',()=>signOut(auth).catch(sayErr));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;notice='';render()});$('memberSearch')?.addEventListener('input',e=>{search=e.target.value;render();const el=$('memberSearch');if(el){el.focus();el.setSelectionRange(search.length,search.length)}});$('reportSearch')?.addEventListener('input',e=>{search=e.target.value;render();const el=$('reportSearch');if(el){el.focus();el.setSelectionRange(search.length,search.length)}});
$('memberForm')?.addEventListener('submit',async e=>{e.preventDefault();if(profile.role!=='admin')return;const name=$('mname').value.trim(),username=$('musername').value.trim().toLowerCase(),password=$('mpassword').value,phone=$('mphone').value.trim();if(!/^[a-z0-9._-]{3,30}$/.test(username)){flash('Username ৩–৩০ অক্ষর; ইংরেজি ছোট হাতের অক্ষর, সংখ্যা, dot, underscore বা hyphen ব্যবহার করুন।',true);return}try{const cred=await createUserWithEmailAndPassword(secondaryAuth,usernameEmail(username),password);await setDoc(doc(secondaryDb,'users',cred.user.uid),{name,username,phone,role:'member',createdAt:new Date().toISOString()});await signOut(secondaryAuth);flash('সদস্য তৈরি হয়েছে। Username ও Password নিরাপদে সদস্যকে দিন।')}catch(e){sayErr(e);try{await signOut(secondaryAuth)}catch{}}});
$('depositForm')?.addEventListener('submit',async e=>{e.preventDefault();const amount=Number($('amount').value);if(!(amount>0)){flash('সঠিক টাকার পরিমাণ দিন।',true);return}try{await addDoc(collection(db,'payments'),{uid:currentUser.uid,username:profile.username||'',amount,date:$('pdate').value,phone:$('phone').value.trim(),reference:$('reference').value.trim(),note:$('note').value.trim(),status:'pending',createdAt:new Date().toISOString(),createdServerAt:serverTimestamp()});flash('জমা Submit হয়েছে; Admin Approval অপেক্ষমাণ।')}catch(e){sayErr(e)}});
$('orgForm')?.addEventListener('submit',async e=>{e.preventDefault();try{settings={name:$('orgname').value.trim(),address:$('orgaddress').value.trim()};await setDoc(doc(db,'settings','org'),settings);flash('সংস্থার তথ্য Save হয়েছে।')}catch(e){sayErr(e)}});
$('pwForm')?.addEventListener('submit',async e=>{e.preventDefault();const old=$('oldpw').value,n=$('newpw').value,n2=$('newpw2').value;if(n!==n2){flash('নতুন Password মেলেনি।',true);return}try{await reauthenticateWithCredential(currentUser,EmailAuthProvider.credential(currentUser.email,old));await updatePassword(currentUser,n);flash('Password পরিবর্তন হয়েছে।')}catch(e){sayErr(e)}});
$('csv')?.addEventListener('click',()=>{const rows=[['Date','Username','Amount','Phone','Reference','Status'],...payments.map(p=>[p.date,p.username,p.amount,p.phone,p.reference,p.status])];const blob=new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='deposit-report.csv';a.click();URL.revokeObjectURL(a.href)});
document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset.act,b.dataset.id));}
async function act(action,id){try{if(action==='approve'||action==='reject'){if(profile.role!=='admin')return;await updateDoc(doc(db,'payments',id),{status:action==='approve'?'approved':'rejected',reviewedBy:currentUser.uid,reviewedAt:new Date().toISOString()});flash(action==='approve'?'জমা Approve হয়েছে।':'জমা Reject হয়েছে।')}else if(action==='deletePayment'){if(profile.role==='admin'&&confirm('এই জমার রেকর্ড বাতিল করবেন?')){await deleteDoc(doc(db,'payments',id));flash('রেকর্ড বাতিল হয়েছে।')}}else if(action==='editMember'){const m=members.find(x=>x.uid===id);if(!m)return;const name=prompt('সদস্যের নাম',m.name||'');if(name===null)return;const phone=prompt('ফোন (ঐচ্ছিক)',m.phone||'');if(phone===null)return;await updateDoc(doc(db,'users',id),{name:name.trim(),phone:phone.trim()});flash('সদস্যের তথ্য Save হয়েছে।')}else if(action==='deleteMember'){if(confirm('এই সদস্যকে Deactivate করবেন? তার profile মুছে যাবে এবং এই অ্যাপের ডেটা-অ্যাক্সেস বন্ধ হবে। Auth account আলাদাভাবে থেকে যেতে পারে।')){await deleteDoc(doc(db,'users',id));flash('সদস্যের profile নিষ্ক্রিয় হয়েছে।')}}else if(action==='receipt'){const p=payments.find(x=>x.id===id);if(!p)return;const m=members.find(x=>x.uid===p.uid);const w=window.open('','_blank');if(!w){flash('রসিদের জন্য popup অনুমতি দিন।',true);return}w.document.write(`<html lang="bn"><meta charset="utf-8"><title>জমার রসিদ</title><style>body{font-family:Arial;padding:30px}.box{max-width:600px;margin:auto;border:1px solid #ccc;padding:25px}h2,p{text-align:center}.row{display:flex;justify-content:space-between;margin:14px 0}@media print{button{display:none}}</style><div class="box"><h2>${esc(settings.name)}</h2><p>${esc(settings.address)}</p><hr><h3>জমার রসিদ</h3><div class="row"><b>সদস্য</b>${esc(m?.name||p.username||'')}</div><div class="row"><b>তারিখ</b>${esc(p.date)}</div><div class="row"><b>পরিমাণ</b>${money(p.amount)}</div><div class="row"><b>ফোন</b>${esc(p.phone||'—')}</div><div class="row"><b>Reference</b>${esc(p.reference||'—')}</div><div class="row"><b>Status</b>${esc(p.status)}</div><p><button onclick="print()">Print / Save PDF</button></p></div></html>`);w.document.close()}}catch(e){sayErr(e)}}
render();
</script></body></html>
